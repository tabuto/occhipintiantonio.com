# Deploy incrementale via FTP dei file modificati su master
name: Deploy FTP

on:
  push:
    branches: [master]
  workflow_dispatch:          # avvio manuale dalla tab Actions
    inputs:
      dry_run:
        description: "Simula senza caricare"
        type: boolean
        default: true
      server_dir:
        description: "Cartella remota di destinazione (deve finire con /). Lasciare _deploytest/ per provare senza toccare il sito; './' pubblica sul sito reale"
        type: string
        default: "_deploytest/"

# evita due deploy sovrapposti
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload FTP (solo file cambiati)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps            # usa "ftp" se l'hosting non supporta FTPS
          local-dir: ./
          # push su master -> sito reale; run manuale -> la cartella scelta negli input
          # (se il campo viene svuotato si ricade su ./; cambiare './' qui sotto
          #  in es. public_html/ se la document root non e' la home FTP)
          server-dir: ${{ github.event_name == 'workflow_dispatch' && inputs.server_dir || './' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # file di sviluppo da non pubblicare
          # (specificare exclude sostituisce i default, quindi vanno ripetuti)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            backlog/**
            CLAUDE.md
            AGENT.md
            SPECS.md
            server.py
            server_start.sh
            server_stop.sh
