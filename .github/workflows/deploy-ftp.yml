# Deploy incrementale via FTP dei file modificati su master
name: Deploy FTP

on:
  push:
    branches: [master]
  workflow_dispatch:          # avvio manuale dalla tab Actions
    inputs:
      dry_run:
        description: "Simula senza caricare"
        type: boolean
        default: true
      server_dir:
        description: "Cartella remota di destinazione (deve finire con /). Lasciare _deploytest/ per provare senza toccare il sito; './' pubblica sul sito reale"
        type: string
        default: "_deploytest/"
      protocol:
        description: "Protocollo: ftps (cifrato) oppure ftp (in chiaro, se l'hosting resetta il canale dati)"
        type: choice
        options: [ftps, ftp]
        default: ftps
      security:
        description: "Verifica del certificato TLS: strict la pretende valida (richiede che FTP_SERVER sia web.marte.vhosting-it.com, l'hostname del certificato, non l'IP ne' occhipintiantonio.com); loose la ignora"
        type: choice
        options: [strict, loose]
        default: strict
      log_level:
        description: "Verbosita del log: verbose mostra il dialogo FTP comando per comando"
        type: choice
        options: [standard, verbose, minimal]
        default: standard

# evita due deploy sovrapposti
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload FTP (solo file cambiati)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # push su master -> ftps; run manuale -> il protocollo scelto negli input
          protocol: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol || 'ftps' }}
          local-dir: ./
          # push su master -> sito reale; run manuale -> la cartella scelta negli input
          # (se il campo viene svuotato si ricade su ./; cambiare './' qui sotto
          #  in es. public_html/ se la document root non e' la home FTP)
          server-dir: ${{ github.event_name == 'workflow_dispatch' && inputs.server_dir || './' }}
          # ATTENZIONE: il default dell'action e' 'loose', cioe' rejectUnauthorized: false:
          # il traffico e' cifrato ma il server NON e' autenticato, quindi un intercettatore
          # puo' presentare un certificato qualunque e leggere la password FTP. 'strict' lo
          # impedisce, ma pretende che FTP_SERVER sia l'hostname del certificato
          # (web.marte.vhosting-it.com, stesso IP del sito). Il fallback del push resta
          # 'loose' finche' un run non-dry con 'strict' non e' stato verificato: vedi AGENT.md.
          security: ${{ github.event_name == 'workflow_dispatch' && inputs.security || 'loose' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: ${{ github.event_name == 'workflow_dispatch' && inputs.log_level || 'standard' }}
          timeout: 60000            # 60s: hosting condivisi a volte sono lenti ad aprire il canale dati
          # file di sviluppo da non pubblicare
          # (specificare exclude sostituisce i default, quindi vanno ripetuti)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            backlog/**
            CLAUDE.md
            AGENT.md
            SPECS.md
            server.py
            server_start.sh
            server_stop.sh
